name: Build and push Docker (tag)

on:
  push:
    tags:
      - 'v*'

jobs:
  check-main:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag is on main
        id: check
        run: |
          git fetch origin main --depth=1
          if git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "Tag is not reachable from main; skipping build."
          fi

  build:
    needs: check-main
    if: needs.check-main.outputs.allowed == 'true'
    uses: phylaxsystems/actions/.github/workflows/release-docker-ghcr-nodejs.yaml@main
    with:
      app-name: foundry-tracer-api
      dockerfile-path: Dockerfile
